name: Gerar APK Orbit Social

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: unzip -o OrbitSocialAndroid.zip

      - name: Adicionar biblioteca de fotos
        run: |
          if ! grep -q "coil-compose" app/build.gradle.kts; then
            sed -i 's/dependencies {/dependencies {\n    implementation("io.coil-kt:coil-compose:2.6.0")/' app/build.gradle.kts
          fi

      - name: Garantir permissão de Internet no AndroidManifest
        run: |
          python3 -c '
          p = "app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "android.permission.INTERNET" not in s:
              i = s.find(">") + 1
              s = s[:i] + "\n    <uses-permission android:name=\"android.permission.INTERNET\" />" + s[i:]
              open(p, "w").write(s)
          '

      - name: Atualizar MainActivity e fechar chaves
        run: |
          cp -f NovoMainActivity.kt app/src/main/java/com/orbitsocial/app/MainActivity.kt

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: gradle assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: OrbitSocial-APK
          path: app/build/outputs/apk/debug/app-debug.apk
